<!-- 메뉴 include -->

 <html xmlns:th="http://www.thymeleaf.org">
 <head><meta http-equiv="Content-Type" content="text/html; charset=utf-8">
   <title>공지사항 보기</title>
   <link rel="stylesheet" type="text/css" href="/stylesheet.css">
   <style type="text/css">
     td.title { padding:4px; background-color:#e3e9ff }
     td.content { padding:10px; line-height:1.6em; text-align:justify; }
     a.list { text-decoration:none;color:black;font-size:10pt; }
   </style>

 </head>
 <body topmargin="0" leftmargin="0">
   <div th:replace="~{Include/topmenu :: topmenu}"></div>
   <table border="0" width="800">
     <tr>
       <td width="20%"  height="500" bgcolor="#ecf1ef" valign="top">

		 <!--  다음에 추가할 부분 -->
		 <div th:replace="~{Include/login_form :: login_form}"></div>
		</td>
       <td width="80%" valign="top">&nbsp;<br>
         <table border="0" width="90%" align="center">
           <tr>
             <td colspan="2"><img src="/Images/img/bullet-01.gif">
              <font color="blue" size="3">공 지 사 항</font><font size="2"> - 글읽기</font></td>
           </tr>
         </table>
       <p>
       <table border="0" width="90%" align="center" cellspacing="0"  style="border-width:1px;border-color:#0066cc;border-style:outset;">
         <tr bgcolor="e3e9ff">
           <td class="title">
             <img src="/Images/img/bullet-04.gif"> <font size="2" face="돋움" th:text="${notice.subject}">
                  제목부분</font>
           </td>
         </tr>
         <tr>
           <td class="content">
             <p align="right"><font size="2" face="돋움">
              <span th:text="${notice.adid}">관리자</span> / <font size="2" face="돋움" th:text="${(#strings.length(notice.regdate) >= 10 ? #strings.substring(notice.regdate, 0, 10) : notice.regdate) + ' / ' + notice.readcnt + '번 읽음'}">2007-1022 / 2번 읽음</font></p>
             <p>
             <span th:utext="${notice.contents}">내용이 들어가는 부분</span></p><!--contents의 내용을 <BR>태그로 처리-->
           </td>
         </tr>
       </table>
       </p>

      <!--**** 여기서부터 게시물 내용 아래쪽의 버튼들이 나옵니다. 답변, 수정, 삭제, 목록보기 ****-->
      <p align="center">
      <font size="2">
       <!-- 목록보기 -->
       <a th:href="@{/Notice/notice_list(page=${page})}"><img src="/Images/img/list-2.gif" border="0"></a>&nbsp;&nbsp;
      </font>
      </p>
    </td>
  </tr>
  </table>
  </body>
  </html>
