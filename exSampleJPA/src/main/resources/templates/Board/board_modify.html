
<!-- 메뉴 include -->
<th:block th:replace="~{Include/topmenu}"></th:block>

<html>
   <head><title>게시판 작성</title>
    <link rel="stylesheet" type="text/css" href="/stylesheet.css">
<script>
	function board_send(){
		alert("글을 수정합니다");
		
		board.submit();
	}
	

</script>
</head>
 <body topmargin="0" leftmargin="0">
 <table border="0" width="800">
 <tr>
   <td width="20%" height="500" bgcolor="#ecf1ef" valign="top">

   <!-- 다음에 추가할 부분 -->
	<th:block th:replace="~{Include/login_form}"></th:block>

   </td>

   <td width="80%" valign="top">&nbsp;<br>
     <img src="/Images/img/bullet-01.gif"><font size="3" face="돋움" color="blue"> <b>반갑습니다</b></font>
     <font size="2"> - 글수정</font><p>
     <img src="/Images/img/bullet-03.gif"><font size="2" face="돋움" color="orange"> 잠깐</font> &nbsp;
     <img src="/Images/img/bullet-02.gif"><font size="2" face="돋움">는 필수 입력 사항입니다.</font><p>
     <form name="board" method="post" action="/Board/board_modify" th:object="${board}">
     <input type="hidden" name="idx" th:field="*{idx}">
     <input type="hidden" name="page" th:value="${page}">
     <!-- th:object는 board로 넘긴걸 다 표시한다 그래서 th:value="${board.idx}"가 아니라 th:field="*{idx}"로 표현이 가능하다 -->	
     <!-- <form name="board" method="post" th:action="@{/Board/board_write}"> -->

	  <table border="0">
       <tr>
         <td width="5%" align="right"><img src="/Images/img/bullet-02.gif"></td>
         <td width="15%"><font size="2" face="돋움">글쓴이</font></td>
         <td width="80%">
         <input type="text" size="20" name="name" th:field="*{name}"></td>
       </tr>
       <tr>
         <td align="right">&nbsp;</td>
         <td ><font size="2" face="돋움">메일주소</font></td>
         <td>
          <input type="text" size="20" name="email"></td>
       </tr>
	   <tr>
         <td align="right"><img src="/Images/img/bullet-02.gif"></td>
         <td><font size="2" face="돋움">제목</font></td>
         <td><input type="text" size="60" name="subject" th:field="*{subject}"></td>
       </tr>
       <tr>
         <td align="right"><img src="/Images/img/bullet-02.gif"></td>
         <td><font size="2" face="돋움">내용</font></td>
         <td><textarea wrap="physical" rows="10" name="contents" cols="60" th:field="*{contents}"></textarea></td>
       </tr>
	   <tr>
         <td align="right"><img src="/Images/img/bullet-02.gif"></td>
         <td><font size="2" face="돋움">비밀번호</font></td>
          <td><input type="password" size="10" name="pass" ><font size="2" face="돋움">*.수정과 삭제시 꼭 입력하셔야 합니다.</font></td>
        </tr>
        <tr></tr>
		<tr>
          <td align="right">&nbsp;</td>
          <td><font size="2">&nbsp;</font></td>
          <td>
              <img src="/Images/img/save.gif" border=0 onClick="board_send()">&nbsp;&nbsp;&nbsp;
              <img src="/Images/img/cancle.gif" border=0 onClick="history.back()">
		<!-- 
            <a href="#" th:onclick="board_send(); return false;"><img src="/Images/img/save.gif" border=0></a>&nbsp;&nbsp;&nbsp;            
            <a href="#" th:onclick="history.back(); return false;"><img src="/Images/img/cancle.gif" border=0></a>
         -->      
          </td>
        </tr>
      </table>
      </form>
    </td>
  </tr>
  </table>
  </body>
  </html>
