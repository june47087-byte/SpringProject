<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>오류 발생</title>
</head>
<script th:inline="javascript">
    // Thymeleaf 데이터를 안전하게 자바스크립트 변수로 가져옵니다.
    /*<![CDATA[*/
    const errorMessage = [[${errorMessage}]];
    
    if (errorMessage) {
        alert("서비스 처리 중 오류가 발생했습니다.\n\n오류 내용: " + errorMessage);
    }
    history.back();
    /*]]>*/
</script>
